services:
  dulcibella:
    build:
      context: .
      args:
        # main is what DulciFata has been running. Hermes release tags (e.g. v2026.9.24) need
        # PYTHON_VERSION: "3.13" as well, since they don't support Python 3.14 yet.
        HERMES_GIT_REF: main
        PYTHON_VERSION: "3.14"
    container_name: dulcibella
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
